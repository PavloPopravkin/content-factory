[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "content-factory"
version = "0.1.0"
description = "Tenant-isolated deterministic content planning and publishing core"
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "httpx", "pyyaml", "typer"]

[project.optional-dependencies]
dev = ["pytest", "respx"]

[project.scripts]
cf = "content_factory.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/content_factory"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "content_factory/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.cf/pytest"
